<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" role="img" aria-label="spaiOS logo">
  <defs>
    <!-- Central sphere gradient: bright top-left specular, deep blue core -->
    <radialGradient id="sphereCore" cx="38%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#B8E8FF"/>
      <stop offset="30%"  stop-color="#2B7FFF"/>
      <stop offset="70%"  stop-color="#0A3DB5"/>
      <stop offset="100%" stop-color="#051060"/>
    </radialGradient>

    <!-- Outer halo glow -->
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00C8FF" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#2060FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0020C0" stop-opacity="0"/>
    </radialGradient>

    <!-- Node small gradient -->
    <radialGradient id="nodeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#80F0FF"/>
      <stop offset="100%" stop-color="#0090D0"/>
    </radialGradient>

    <radialGradient id="nodeGradTeal" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#A0FFE0"/>
      <stop offset="100%" stop-color="#00B888"/>
    </radialGradient>

    <radialGradient id="nodeGradViolet" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#C0B8FF"/>
      <stop offset="100%" stop-color="#6040D0"/>
    </radialGradient>

    <!-- Soft sphere glow filter -->
    <filter id="sphereGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Node glow filter -->
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Halo (outermost glow) ── -->
  <circle cx="60" cy="60" r="54" fill="url(#haloGrad)"/>

  <!-- ── Orbit rings (two ellipses for 3-D sphere feel) ── -->
  <ellipse cx="60" cy="60" rx="46" ry="11"
           fill="none" stroke="#00C8FF" stroke-width="0.7" stroke-opacity="0.30"
           stroke-dasharray="4 3"/>
  <ellipse cx="60" cy="60" rx="11" ry="46"
           fill="none" stroke="#6060FF" stroke-width="0.7" stroke-opacity="0.22"
           stroke-dasharray="4 3"/>

  <!-- ── Spoke lines: center → each node ── -->
  <!-- 8 nodes at 45° steps, orbit radius 44 -->
  <!-- right         --> <line x1="60" y1="60" x2="104" y2="60"    stroke="#00C8FF" stroke-width="0.6" stroke-opacity="0.28"/>
  <!-- top-right     --> <line x1="60" y1="60" x2="91"  y2="29"    stroke="#00C8FF" stroke-width="0.6" stroke-opacity="0.22"/>
  <!-- top           --> <line x1="60" y1="60" x2="60"  y2="16"    stroke="#00C8FF" stroke-width="0.6" stroke-opacity="0.28"/>
  <!-- top-left      --> <line x1="60" y1="60" x2="29"  y2="29"    stroke="#00C8FF" stroke-width="0.6" stroke-opacity="0.22"/>
  <!-- left          --> <line x1="60" y1="60" x2="16"  y2="60"    stroke="#00C8FF" stroke-width="0.6" stroke-opacity="0.28"/>
  <!-- bottom-left   --> <line x1="60" y1="60" x2="29"  y2="91"    stroke="#00C8FF" stroke-width="0.6" stroke-opacity="0.22"/>
  <!-- bottom        --> <line x1="60" y1="60" x2="60"  y2="104"   stroke="#00C8FF" stroke-width="0.6" stroke-opacity="0.28"/>
  <!-- bottom-right  --> <line x1="60" y1="60" x2="91"  y2="91"    stroke="#00C8FF" stroke-width="0.6" stroke-opacity="0.22"/>

  <!-- ── 8 Orbital nodes ── -->
  <circle cx="104" cy="60"  r="4.0" fill="url(#nodeGrad)"       filter="url(#nodeGlow)"/>
  <circle cx="91"  cy="29"  r="3.2" fill="url(#nodeGradTeal)"   filter="url(#nodeGlow)"/>
  <circle cx="60"  cy="16"  r="4.0" fill="url(#nodeGrad)"       filter="url(#nodeGlow)"/>
  <circle cx="29"  cy="29"  r="3.2" fill="url(#nodeGradViolet)" filter="url(#nodeGlow)"/>
  <circle cx="16"  cy="60"  r="4.0" fill="url(#nodeGrad)"       filter="url(#nodeGlow)"/>
  <circle cx="29"  cy="91"  r="3.2" fill="url(#nodeGradTeal)"   filter="url(#nodeGlow)"/>
  <circle cx="60"  cy="104" r="4.0" fill="url(#nodeGrad)"       filter="url(#nodeGlow)"/>
  <circle cx="91"  cy="91"  r="3.2" fill="url(#nodeGradViolet)" filter="url(#nodeGlow)"/>

  <!-- ── Central sphere ── -->
  <circle cx="60" cy="60" r="28" fill="url(#sphereCore)" filter="url(#sphereGlow)"/>

  <!-- Specular highlight: primary -->
  <ellipse cx="52" cy="50" rx="9" ry="7"
           fill="white" fill-opacity="0.18" transform="rotate(-20 52 50)"/>
  <!-- Specular highlight: secondary pinpoint -->
  <circle cx="54" cy="51" r="3.5" fill="white" fill-opacity="0.28"/>

  <!-- ── Wordmark ── -->
  <!-- "spai" in white, "OS" in electric blue -->
  <text x="138" y="56"
        font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="38" font-weight="700" letter-spacing="-1.5"
        fill="#FFFFFF">spai<tspan fill="#00C8FF">OS</tspan></text>

  <!-- Tagline -->
  <text x="140" y="78"
        font-family="'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="11.5" font-weight="400" letter-spacing="3.5"
        fill="#607090">AI OPERATING SYSTEM</text>
</svg>
