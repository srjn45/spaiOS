[project]
name = "spaiOS"
version = "0.1.0"
description = "Spatial AI overlay for Linux desktop — local LLM assistant with screen vision"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama",
    "pillow",
    "pyqt6",
    "pynput",
    "python-xlib",
    "mss>=10.2.0",
    "faster-whisper>=1.1.0",
    "sounddevice>=0.4.7",
    "vosk>=0.3.45",
    "openwakeword>=0.4.0",
    "noisereduce>=3.0.3",
    "pychrome>=0.2.4",
    "chromadb>=0.6.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
]

[project.scripts]
spaiOS = "spaiOS.main:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "black>=26.3.1",
    "flake8>=7.3.0",
    "pytest>=9.0.3",
]

