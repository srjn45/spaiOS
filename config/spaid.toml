# spaiSH daemon configuration
# Copy this file to ~/.config/spaish/spaid.toml

[provider]
# LiteLLM proxy — handles priority routing: Claude → GPT-4o-mini → local Ollama
# The proxy is started by the litellm-proxy.service systemd unit (installer sets this up)
# See ~/.config/spaish/litellm.yaml for the full routing config
endpoint = "http://localhost:4000"
# Matches general_settings.master_key in litellm.yaml — do not change
api_key_env = "LITELLM_MASTER_KEY"
# Primary model group — litellm routes to Claude and falls back automatically
model = "claude"

[local]
# Ollama endpoint (used when no API key is set, or prefer_local = true)
ollama_endpoint = "http://localhost:11434"
# Local model to use via Ollama
local_model = "qwen2.5-coder"

[routing]
# Commands that bypass AI entirely and run directly
passthrough_commands = ["cd", "ls", "pwd", "clear", "exit", "history", "echo", "which", "env"]
# Set to true to always use local model (full privacy mode)
prefer_local = false

[permissions]
# Seconds before an elevated (sudo) session permission expires
sudo_session_timeout = 300

[spaish]
# Shell to wrap. Defaults to $SHELL environment variable, then bash.
shell = ""
# Exit codes >= this value trigger AI suggestions. 1 = any failure.
error_threshold = 1
# Times a pattern must repeat before a suggestion is shown.
pattern_min_count = 3
# Number of recent command+output pairs kept in the smart context window.
context_window = 20
