[package]
name = "compositor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "spai-compositor"
path = "src/main.rs"

[dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
    "backend_winit",
    "renderer_gl",
    "use_system_lib",
] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
